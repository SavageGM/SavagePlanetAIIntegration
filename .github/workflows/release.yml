name: Package Foundry module
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package module
        shell: bash
        run: |
          python3 -m json.tool module.json >/dev/null
          mkdir -p /tmp/savage-planet-ai-adapter
          cp module.json OPEN_DIAGNOSTICS_MACRO.js README.md /tmp/savage-planet-ai-adapter/
          cp -R scripts styles /tmp/savage-planet-ai-adapter/
          cd /tmp
          zip -r "$GITHUB_WORKSPACE/savage-planet-ai-adapter.zip" savage-planet-ai-adapter
      - name: Publish or update v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 savage-planet-ai-adapter.zip --clobber
          else
            gh release create v0.1.0 savage-planet-ai-adapter.zip --target main --title "Savage Planet AI Adapter v0.1.0" --notes "GM-only, read-only GGA diagnostics for Foundry v14."
          fi
