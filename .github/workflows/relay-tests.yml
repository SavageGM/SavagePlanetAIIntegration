name: Validate MCP relay
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install relay dependencies
        working-directory: relay
        run: npm install --no-audit --no-fund
      - name: Run unit and authenticated relay tests
        working-directory: relay
        run: npm test
      - name: Validate manifest
        run: node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('module.json','utf8'));if(m.id!=='savage-planet-ai-adapter')process.exit(1)"
