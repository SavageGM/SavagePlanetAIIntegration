services:
  relay:
    build:
      context: ../relay
    restart: unless-stopped
    env_file:
      - ../relay/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
    networks:
      - internal
    expose:
      - "8787"
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: "${RELAY_DOMAIN:?Set RELAY_DOMAIN in deployment environment}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay
    networks:
      - internal
networks:
  internal:
volumes:
  caddy_data:
  caddy_config:
